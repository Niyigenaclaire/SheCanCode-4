<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind Template for App & Software Site</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .bg-circle {
            background: linear-gradient(135deg, hsl(215, 49%, 81%) 0%, #ced7f7 100%);
            border-radius: 50%;
            opacity: 0.8;
        }

        .gradient-text {
            background: linear-gradient(to right, #818CF8, #A5B4FC);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>

<body class="bg-white overflow-x-hidden">

    <!-- Hero Section Container -->
    <div class="container mx-auto px-6 lg:px-20 min-h-screen flex items-center justify-center">
        <div class="flex flex-col lg:flex-row items-center justify-between w-full max-w-4xl gap-16 lg:gap-20 py-12">

            <!-- Left Division: Text Content - Fixed line spacing and breaks -->
            <div class="w-full lg:w-1/2 flex flex-col space-y-4 text-center lg:text-left items-center lg:items-start">
                <span class="text-slate-700 text-sm lg:text-base font-medium">
                    Ready to Use Tailwind CSS Web Template.
                </span>

                <h1 class="text-4xl lg:text-5xl font-extrabold text-[#1E293B] leading-[1.2] tracking-tight">
                    <span class="block">Tailwind Template for</span>
                    <span class="block"><span class="gradient-text">App & Software</span> Site.</span>
                </h1>

                <p class="text-slate-500 text-sm lg:text-base max-w-md leading-relaxed">
                    All in one Tailwind CSS site template for - App and Software sites Comes with all essential
                    components.
                </p>

                <!-- Buttons Container -->
                <div class="flex flex-wrap items-center justify-center lg:justify-start gap-6 pt-4">
                    <!-- Download Now Button -->
                    <a href="#"
                        class="flex items-center bg-[#111827] text-white rounded-md overflow-hidden hover:bg-slate-800 transition-colors">
                        <span class="px-6 py-3 lg:px-8 lg:py-4 font-bold text-xs lg:text-sm">Download Now</span>
                        <span class="w-[1px] h-6 bg-slate-500 opacity-40"></span>
                        <span class="px-5 py-3 lg:px-6 lg:py-4">
                            <svg class="w-4 h-4 lg:w-5 lg:h-5 fill-current" viewBox="0 0 384 512"
                                xmlns="http://www.w3.org/2000/svg">
                                <path
                                    d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 33-17.9 64.4-17.9 31.7 0 39.4 17.9 64.9 17.9 48.9-.7 90.1-82.4 102.2-116.6-67-31.1-61.2-101.4-61.2-101.4zM249.1 88.1c21.2-25.8 14.8-54.9 14.8-54.9 0 0-27.4 1.8-48.4 25.8-22.5 25.8-15.6 52.8-15.6 52.8 0 0 27.8 2.1 49.2-23.7z" />
                            </svg>
                        </span>
                    </a>

                    <!-- Watch Demo Button -->
                    <a href="#" class="flex items-center gap-4 group">
                        <div
                            class="w-10 h-10 lg:w-14 lg:h-14 rounded-full border border-slate-200 flex items-center justify-center group-hover:border-[#A5B4FC] transition-all">
                            <svg class="w-3 h-3 lg:w-4 lg:h-4 fill-slate-900 group-hover:fill-[#A5B4FC] ml-1"
                                viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path d="M8 5v14l11-7z" />
                            </svg>
                        </div>
                        <div class="flex flex-col text-left text-xs lg:text-sm">
                            <span class="font-bold text-slate-900">Watch Demo</span>
                            <span class="text-slate-500">See how it works</span>
                        </div>
                    </a>
                </div>
            </div>

            <!-- Right Division: Image and Decorations -->
            <div class="w-full lg:w-1/2 relative flex items-center justify-center lg:justify-end lg:pr-8">

                <!-- Main Visual Container -->
                <div class="relative flex items-center justify-center w-[280px] lg:w-[400px]">

                    <!-- Background Circle -->
                    <div
                        class="absolute top-[40%] left-1/2 -translate-x-1/2 -translate-y-1/2 w-[280px] h-[280px] lg:w-[450px] lg:h-[450px] bg-circle">
                    </div>

                    <!-- Red Waves Decoration -->
                    <div class="absolute bottom-[18%] -left-6 lg:-left-8 z-20 scale-75 lg:scale-100">
                        <svg width="60" height="40" viewBox="0 0 60 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M0 5C5 0 10 0 15 5C20 10 25 10 30 5C35 0 40 0 45 5C50 10 55 10 60 5"
                                stroke="#F87171" stroke-width="2" />
                            <path d="M0 15C5 10 10 10 15 15C20 20 25 20 30 15C35 10 40 10 45 15C50 20 55 20 60 15"
                                stroke="#F87171" stroke-width="2" />
                            <path d="M0 25C5 20 10 20 15 25C20 30 25 30 30 25C35 20 40 20 45 25C50 30 55 30 60 25"
                                stroke="#F87171" stroke-width="2" />
                            <path d="M0 35C5 30 10 30 15 35C20 40 25 40 30 35C35 30 40 30 45 35C50 40 55 40 60 35"
                                stroke="#F87171" stroke-width="2" />
                        </svg>
                    </div>

                    <!-- Stars Decorations -->
                    <div class="absolute top-[10%] -right-8 lg:-right-16 z-20 flex gap-4 scale-75 lg:scale-100">
                        <!-- Purple Sparkle -->
                        <svg class="w-10 h-10 text-[#818CF8] fill-current" viewBox="0 0 24 24"
                            xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M12 0c.5 6.5 5.5 11.5 12 12-6.5.5-11.5 5.5-12 12-.5-6.5-5.5-11.5-12-12 6.5-.5 11.5-5.5 12-12z" />
                        </svg>
                        <!-- Teal Sparkle -->
                        <svg class="w-6 h-6 text-[#2DD4BF] fill-current mt-10 -ml-4" viewBox="0 0 24 24"
                            xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M12 0c.5 6.5 5.5 11.5 12 12-6.5.5-11.5 5.5-12 12-.5-6.5-5.5-11.5-12-12 6.5-.5 11.5-5.5 12-12z" />
                        </svg>
                    </div>

                    <!-- Phone Mockup -->
                    <div class="relative z-10 max-w-[240px] lg:max-w-[320px]">
                        <img src="hero-light.png" alt="Phone Mockup" class="w-full h-auto drop-shadow-2xl">
                    </div>

                </div>
            </div>

        </div>
    </div>

</body>

</html>
